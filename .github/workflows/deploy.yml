name: Deploy to Shopify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Theme to Shopify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Shopify
        env:
          SHOPIFY_STORE: ${{ secrets.SHOP_STORE_OS2 }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOP_PASSWORD_OS2 }}
        run: |
          shopify theme push --store=$SHOPIFY_STORE --password=$SHOPIFY_PASSWORD --theme=live --allow-live

